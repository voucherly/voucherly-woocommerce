name: Deploy to WordPress.org

on:
  push:
    tags:
      - "[0-9]+.[0-9]+.[0-9]+"
      - "v[0-9]+.[0-9]+.[0-9]+"
  workflow_dispatch:
    inputs:
      dry-run:
        description: "Prepare trunk and tag without committing to SVN"
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: wordpress.org
    steps:
      - uses: actions/checkout@v7

      - name: Check version consistency
        id: version
        run: |
          plugin=$(grep -m1 -E '^\s*\*\s*Version:' woocommerce-gateway-voucherly.php | sed -E 's/.*Version:\s*//' | tr -d '[:space:]')
          stable=$(grep -m1 -E '^Stable tag:' readme.txt | sed -E 's/Stable tag:\s*//' | tr -d '[:space:]')
          package=$(node -p "require('./package.json').version")
          echo "plugin header: $plugin | readme stable tag: $stable | package.json: $package"
          if [ "$plugin" != "$stable" ] || [ "$plugin" != "$package" ]; then
            echo "::error::Version mismatch between plugin header, readme Stable tag and package.json"
            exit 1
          fi
          if [ "$GITHUB_REF_TYPE" = "tag" ] && [ "${GITHUB_REF_NAME#v}" != "$plugin" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match plugin version $plugin"
            exit 1
          fi
          echo "version=$plugin" >> "$GITHUB_OUTPUT"

      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          tools: composer

      - name: Install production PHP dependencies
        run: composer install --no-dev --optimize-autoloader --no-interaction --no-progress

      - uses: actions/setup-node@v7
        with:
          node-version: "22"

      - name: Build blocks checkout script
        run: |
          npm install --no-audit --no-fund
          npm run build

      - name: Deploy to WordPress.org SVN
        id: deploy
        uses: 10up/action-wordpress-plugin-deploy@2.3.0
        with:
          generate-zip: true
          dry-run: ${{ github.event_name == 'workflow_dispatch' && inputs.dry-run }}
        env:
          SVN_USERNAME: ${{ secrets.SVN_USERNAME }}
          SVN_PASSWORD: ${{ secrets.SVN_PASSWORD }}
          # The GitHub repository is voucherly-woocommerce, the WordPress.org slug is voucherly.
          SLUG: voucherly
          VERSION: ${{ steps.version.outputs.version }}

      - uses: actions/upload-artifact@v7
        with:
          name: voucherly-${{ steps.version.outputs.version }}
          path: ${{ steps.deploy.outputs.zip-path }}
