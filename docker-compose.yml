name: voucherly-wp

x-db-env: &db-env
  WORDPRESS_DB_HOST: db
  WORDPRESS_DB_NAME: wordpress
  WORDPRESS_DB_USER: wordpress
  WORDPRESS_DB_PASSWORD: wordpress

x-wp-volumes: &wp-volumes
  - wordpress:/var/www/html
  - .:/var/www/html/wp-content/plugins/voucherly

services:
  db:
    image: mariadb:11
    environment:
      MARIADB_ROOT_PASSWORD: root
      MARIADB_DATABASE: wordpress
      MARIADB_USER: wordpress
      MARIADB_PASSWORD: wordpress
    volumes:
      - db:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      retries: 30

  wordpress:
    image: wordpress:${WP_VERSION:-7.1}-php${PHP_VERSION:-8.3}-apache
    ports:
      - "8888:80"
    depends_on:
      db:
        condition: service_healthy
    environment:
      <<: *db-env
      WORDPRESS_DEBUG: 1
      # Voucherly accepts only HTTPS callback URLs, so the site must answer on both localhost and the HTTPS tunnel host.
      WORDPRESS_CONFIG_EXTRA: |
        define('WP_DEBUG_LOG', true);
        define('WP_DEBUG_DISPLAY', false);
        define('WP_ENVIRONMENT_TYPE', 'local');
        if (!empty($$_SERVER['HTTP_HOST'])) {
            define('WP_HOME', (!empty($$_SERVER['HTTPS']) ? 'https' : 'http').'://'.$$_SERVER['HTTP_HOST']);
            define('WP_SITEURL', WP_HOME);
        }
    volumes: *wp-volumes

  tunnel:
    image: cloudflare/cloudflared:latest
    profiles: ["tunnel"]
    command: tunnel --no-autoupdate --metrics 0.0.0.0:2000 --url http://wordpress:80
    depends_on:
      - wordpress

  cli:
    image: wordpress:cli-php${PHP_VERSION:-8.3}
    profiles: ["cli"]
    # The CLI image is Alpine (www-data = 82), the Apache image is Debian (www-data = 33).
    user: "33:33"
    depends_on:
      - wordpress
    environment:
      <<: *db-env
      HOME: /tmp
    volumes: *wp-volumes

volumes:
  db:
  wordpress:
